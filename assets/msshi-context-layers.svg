<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 682" width="1000" height="682" role="img" aria-labelledby="title desc">
<title id="title">Lima lapis konteks proyek</title><desc id="desc">Diagram lima lapis dari peta lokal, ekstraksi, seleksi, memori, sampai prefix dan anggaran.</desc>
<defs>
  <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#10162A"/><stop offset="1" stop-color="#211C3B"/></linearGradient>
  <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#C7BAFF"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A2E6D0"/></marker>
</defs>
<rect width="1000" height="682" rx="26" fill="url(#bg)"/>
<g font-family="Segoe UI,system-ui,sans-serif"><text x="42" y="45" font-size="17" fill="#FFDA94" font-weight="720" text-anchor="start">05   /   KONTEKS PROYEK</text><text x="42" y="91" font-size="39" fill="#F4F5FF" font-weight="780" text-anchor="start">Dari banyak berkas ke bukti terpilih</text><text x="43" y="123" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Pertanyaan aktif menentukan sumber mana yang masuk ke model.</text><rect x="42" y="153" width="916" height="70" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="65" y="197" font-size="23" fill="#A2E6D0" font-weight="750" text-anchor="start">01</text><text x="123" y="197" font-size="23" fill="#F4F5FF" font-weight="720" text-anchor="start">Peta lokal</text><text x="479" y="197" font-size="18" fill="#C4CFE8" font-weight="550" text-anchor="start">Daftar file, versi, dan relasinya.</text><rect x="42" y="237" width="916" height="70" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="65" y="281" font-size="23" fill="#A2E6D0" font-weight="750" text-anchor="start">02</text><text x="123" y="281" font-size="23" fill="#F4F5FF" font-weight="720" text-anchor="start">Ekstraksi halaman</text><text x="479" y="281" font-size="18" fill="#C4CFE8" font-weight="550" text-anchor="start">Ambil teks. Pakai OCR bila perlu.</text><rect x="42" y="321" width="916" height="70" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="65" y="365" font-size="23" fill="#A2E6D0" font-weight="750" text-anchor="start">03</text><text x="123" y="365" font-size="23" fill="#F4F5FF" font-weight="720" text-anchor="start">Pilih dan padatkan</text><text x="479" y="365" font-size="18" fill="#C4CFE8" font-weight="550" text-anchor="start">Ambil petikan yang menjawab pertanyaan.</text><rect x="42" y="405" width="916" height="70" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="65" y="449" font-size="23" fill="#A2E6D0" font-weight="750" text-anchor="start">04</text><text x="123" y="449" font-size="23" fill="#F4F5FF" font-weight="720" text-anchor="start">Memori proyek</text><text x="479" y="449" font-size="18" fill="#C4CFE8" font-weight="550" text-anchor="start">Simpan keputusan dan penunjuk sumber.</text><rect x="42" y="489" width="916" height="70" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="65" y="533" font-size="23" fill="#A2E6D0" font-weight="750" text-anchor="start">05</text><text x="123" y="533" font-size="23" fill="#F4F5FF" font-weight="720" text-anchor="start">Prefix dan anggaran</text><text x="479" y="533" font-size="18" fill="#C4CFE8" font-weight="550" text-anchor="start">Kirim petikan terpilih dan cek biaya.</text><rect x="42" y="593" width="916" height="53" rx="12" fill="#202A46" stroke="#3F5074"/><text x="61" y="627" font-size="18" fill="#F4F5FF" font-weight="600" text-anchor="start">Contoh penunjuk bukti: metode-v2#p12:par3   ·   Cek petikan di halaman asli.</text></g>
</svg>
