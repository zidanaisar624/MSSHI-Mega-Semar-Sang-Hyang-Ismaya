<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" width="1000" height="556" role="img" aria-labelledby="title desc">
<title id="title">Empat mode setup MSSHI</title><desc id="desc">Diagram empat pilihan: Solo, Custom Bots, Selective, dan MuZA Preset. Semua dimulai dari pratinjau.</desc>
<defs>
  <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#10162A"/><stop offset="1" stop-color="#211C3B"/></linearGradient>
  <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#C7BAFF"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A2E6D0"/></marker>
</defs>
<rect width="1000" height="556" rx="26" fill="url(#bg)"/>
<g font-family="Segoe UI,system-ui,sans-serif"><text x="42" y="45" font-size="17" fill="#FFDA94" font-weight="720" text-anchor="start">01   /   MULAI DI SINI</text><text x="42" y="91" font-size="39" fill="#F4F5FF" font-weight="780" text-anchor="start">Pilih cara memasang MSSHI</text><text x="43" y="123" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Mulai dari satu agen atau susun workspace untuk satu tim.</text><rect x="42" y="156" width="449" height="148" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="185" font-size="16" fill="#C7BAFF" font-weight="750" text-anchor="start">SOLO</text><text x="64" y="219" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Satu agen</text><text x="64" y="247" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">51 skill inti dan 12 wrapper di satu tujuan.</text><text x="64" y="272" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Cocok untuk mulai belajar atau mencoba.</text><rect x="509" y="156" width="449" height="148" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="531" y="185" font-size="16" fill="#A2E6D0" font-weight="750" text-anchor="start">CUSTOM-BOTS</text><text x="531" y="219" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Tim buatanmu</text><text x="531" y="247" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Atur nama, persona, dan pembagian skill</text><text x="531" y="272" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">di matriks, lalu ekspor workspace per bot.</text><rect x="42" y="323" width="449" height="148" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="352" font-size="16" fill="#F6C0E0" font-weight="750" text-anchor="start">SELECTIVE</text><text x="64" y="386" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Pilih paket</text><text x="64" y="414" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Pilih hanya bidang yang dibutuhkan.</text><text x="64" y="439" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Contoh: core dan filmmaking.</text><rect x="509" y="323" width="449" height="148" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="531" y="352" font-size="16" fill="#FFDA94" font-weight="750" text-anchor="start">MUZA-PRESET</text><text x="531" y="386" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Lima workspace MuZA</text><text x="531" y="414" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Gunakan pembagian peran yang siap ditinjau.</text><text x="531" y="439" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Petakan tiap workspace ke profil host.</text><rect x="42" y="485" width="916" height="53" rx="12" fill="#202A46" stroke="#3F5074"/><text x="61" y="519" font-size="18" fill="#F4F5FF" font-weight="600" text-anchor="start">1  Pratinjau perintah     →     2  Periksa tujuan     →     3  Tambahkan --apply</text></g>
</svg>
