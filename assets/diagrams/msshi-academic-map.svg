<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 739" width="1000" height="739" role="img" aria-labelledby="title desc">
<title id="title">Tujuh mesin akademik</title><desc id="desc">Tujuh alur akademik yang bisa dipilih sesuai hambatan dan menghasilkan artefak yang dapat ditinjau.</desc>
<defs>
  <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#10162A"/><stop offset="1" stop-color="#211C3B"/></linearGradient>
  <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#C7BAFF"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A2E6D0"/></marker>
</defs>
<rect width="1000" height="739" rx="26" fill="url(#bg)"/>
<g font-family="Segoe UI,system-ui,sans-serif"><text x="42" y="45" font-size="17" fill="#FFDA94" font-weight="720" text-anchor="start">04   /   SKRIPSI, TESIS, DISERTASI</text><text x="42" y="91" font-size="39" fill="#F4F5FF" font-weight="780" text-anchor="start">Pilih alur sesuai hambatan</text><text x="43" y="123" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Tujuh mesin kerja dengan hasil yang bisa diperiksa.</text><rect x="42" y="155" width="916" height="63" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="63" y="196" font-size="22" fill="#FFDA94" font-weight="740" text-anchor="start">01</text><text x="125" y="196" font-size="23" fill="#F4F5FF" font-weight="700" text-anchor="start">Gap dan kebaruan</text><text x="466" y="196" font-size="18" fill="#C4CFE8" font-weight="540" text-anchor="start">Matriks studi dan kandidat pertanyaan.</text><rect x="42" y="229" width="916" height="63" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="63" y="270" font-size="22" fill="#FFDA94" font-weight="740" text-anchor="start">02</text><text x="125" y="270" font-size="23" fill="#F4F5FF" font-weight="700" text-anchor="start">Bacaan dan jejak bukti</text><text x="466" y="270" font-size="18" fill="#C4CFE8" font-weight="540" text-anchor="start">Indeks halaman dan peta klaim–bukti.</text><rect x="42" y="303" width="916" height="63" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="63" y="344" font-size="22" fill="#FFDA94" font-weight="740" text-anchor="start">03</text><text x="125" y="344" font-size="23" fill="#F4F5FF" font-weight="700" text-anchor="start">Metode dan analisis</text><text x="466" y="344" font-size="18" fill="#C4CFE8" font-weight="540" text-anchor="start">Hasil uji, asumsi, dan cara mengulangnya.</text><rect x="42" y="377" width="916" height="63" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="63" y="418" font-size="22" fill="#FFDA94" font-weight="740" text-anchor="start">04</text><text x="125" y="418" font-size="23" fill="#F4F5FF" font-weight="700" text-anchor="start">Revisi pembimbing</text><text x="466" y="418" font-size="18" fill="#C4CFE8" font-weight="540" text-anchor="start">Peta masukan, perubahan, dan bukti.</text><rect x="42" y="451" width="916" height="63" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="63" y="492" font-size="22" fill="#FFDA94" font-weight="740" text-anchor="start">05</text><text x="125" y="492" font-size="23" fill="#F4F5FF" font-weight="700" text-anchor="start">Tulis dan sunting</text><text x="466" y="492" font-size="18" fill="#C4CFE8" font-weight="540" text-anchor="start">Draf dengan klaim dan sitasi terlacak.</text><rect x="42" y="525" width="916" height="63" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="63" y="566" font-size="22" fill="#FFDA94" font-weight="740" text-anchor="start">06</text><text x="125" y="566" font-size="23" fill="#F4F5FF" font-weight="700" text-anchor="start">Ritme kerja</text><text x="466" y="566" font-size="18" fill="#C4CFE8" font-weight="540" text-anchor="start">Satu langkah kecil dengan definisi selesai.</text><rect x="42" y="599" width="916" height="63" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="63" y="640" font-size="22" fill="#FFDA94" font-weight="740" text-anchor="start">07</text><text x="125" y="640" font-size="23" fill="#F4F5FF" font-weight="700" text-anchor="start">Simulasi sidang</text><text x="466" y="640" font-size="18" fill="#C4CFE8" font-weight="540" text-anchor="start">Pertanyaan penguji dan revisi slide.</text><text x="43" y="710" font-size="18" fill="#C4CFE8" font-weight="550" text-anchor="start">Val memeriksa sumber. Shizuka menjelaskan temuan dan batasnya kepada pengguna.</text></g>
</svg>
