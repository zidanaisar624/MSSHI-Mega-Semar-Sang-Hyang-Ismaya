<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" width="1000" height="910" role="img" aria-labelledby="title desc">
<title id="title">Alur kreatif bersama Kiki-Chii</title><desc id="desc">Alur kreatif dari brief sampai ekspor dengan persetujuan konsep, draf yang dapat diedit, preview, dan revisi. Video 10–40 menit memakai outline bab, rough cut per segmen, review dengan timecode, dan pemeriksaan timeline master.</desc>
<defs>
  <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#10162A"/><stop offset="1" stop-color="#211C3B"/></linearGradient>
  <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#C7BAFF"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A2E6D0"/></marker>
</defs>
<rect width="1000" height="910" rx="26" fill="url(#bg)"/>
<g font-family="Segoe UI,system-ui,sans-serif"><text x="42" y="45" font-size="17" fill="#FFDA94" font-weight="720" text-anchor="start">03   /   STUDIO KREATIF</text><text x="42" y="91" font-size="39" fill="#F4F5FF" font-weight="780" text-anchor="start">Buat video yang bisa direvisi</text><text x="43" y="123" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Video pendek dan 10–40 menit, dari Concepting First sampai ekspor.</text><path d="M476 225H520" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M744 293V326" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M524 402H479" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M253 470V503" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M476 579H520" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><rect x="42" y="157" width="434" height="136" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="186" font-size="16" fill="#FFDA94" font-weight="750" text-anchor="start">01   /   BRIEF</text><text x="64" y="220" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Tentukan konsep</text><text x="64" y="248" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Audiens, pesan, gaya, durasi.</text><rect x="524" y="157" width="434" height="136" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="546" y="186" font-size="16" fill="#FFDA94" font-weight="750" text-anchor="start">02   /   SETUJUI</text><text x="546" y="220" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Periksa storyboard</text><text x="546" y="248" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Setujui arah, shot, suara, dan batas biaya.</text><rect x="524" y="334" width="434" height="136" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="546" y="363" font-size="16" fill="#C7BAFF" font-weight="750" text-anchor="start">03   /   BUAT</text><text x="546" y="397" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Siapkan aset dan gerak</text><text x="546" y="425" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Rekam sendiri atau pilih alat yang tersedia.</text><rect x="42" y="334" width="434" height="136" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="363" font-size="16" fill="#C7BAFF" font-weight="750" text-anchor="start">04   /   SIMPAN PROYEK</text><text x="64" y="397" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Buat draf yang bisa diedit</text><text x="64" y="425" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Simpan layer, adegan, dan timeline.</text><rect x="42" y="511" width="434" height="136" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="540" font-size="16" fill="#F6C0E0" font-weight="750" text-anchor="start">05   /   PREVIEW</text><text x="64" y="574" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Review dan revisi</text><text x="64" y="602" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Catat perubahan. Ulangi draf bila perlu.</text><rect x="524" y="511" width="434" height="136" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="546" y="540" font-size="16" fill="#A2E6D0" font-weight="750" text-anchor="start">06   /   FINAL</text><text x="546" y="574" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Setujui dan ekspor</text><text x="546" y="602" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Simpan preferensi yang kamu setujui.</text><rect x="42" y="670" width="916" height="170" rx="18" fill="#202A46" stroke="#3F5074"/><text x="65" y="708" fill="#FFDA94" font-size="22" font-weight="750">UNTUK VIDEO 10–40 MENIT</text><text x="65" y="745" fill="#F4F5FF" font-size="21" font-weight="650">Outline per bab → rough cut per segmen → review dengan timecode</text><text x="65" y="780" fill="#C4CFE8" font-size="19">Gabungkan timeline. Cek durasi total, kontinuitas, audio, dan subtitle.</text><text x="65" y="812" fill="#C4CFE8" font-size="19">Minta persetujuan master sebelum ekspor final.</text><text x="43" y="878" font-size="18" fill="#C4CFE8" font-weight="550" text-anchor="start">Higgsfield, alat motion, ArtCraft, dan Blender dipilih sesuai tugas dan akses.</text></g>
</svg>
