<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-labelledby="title desc">
<title id="title">Batas integrasi MSSHI</title><desc id="desc">Perbedaan skill bawaan, runtime eksternal, dan layanan akun, serta pemeriksaan izin dan biaya sebelum memanggil alat.</desc>
<defs>
  <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#10162A"/><stop offset="1" stop-color="#211C3B"/></linearGradient>
  <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#C7BAFF"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A2E6D0"/></marker>
</defs>
<rect width="1000" height="625" rx="26" fill="url(#bg)"/>
<g font-family="Segoe UI,system-ui,sans-serif"><text x="42" y="45" font-size="17" fill="#FFDA94" font-weight="720" text-anchor="start">06   /   INTEGRASI DAN ANGGARAN</text><text x="42" y="91" font-size="39" fill="#F4F5FF" font-weight="780" text-anchor="start">Pilih jalur sesuai tugas</text><text x="43" y="123" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Kenali apa yang tersedia di ZIP dan apa yang perlu disiapkan.</text><rect x="42" y="154" width="292" height="167" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="183" font-size="16" fill="#A2E6D0" font-weight="750" text-anchor="start">DI DALAM ZIP</text><text x="64" y="217" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Skill bawaan</text><text x="64" y="245" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Instruksi, persona, CLI,</text><text x="64" y="270" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">dan panduan kerja.</text><rect x="354" y="154" width="292" height="167" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="376" y="183" font-size="16" fill="#C7BAFF" font-weight="750" text-anchor="start">DI PERANGKAT</text><text x="376" y="217" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Alat lokal</text><text x="376" y="245" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Aplikasi dan adapter</text><text x="376" y="270" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">yang sudah dipasang.</text><rect x="666" y="154" width="292" height="167" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="688" y="183" font-size="16" fill="#F6C0E0" font-weight="750" text-anchor="start">DI AKUN</text><text x="688" y="217" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Layanan eksternal</text><text x="688" y="245" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Butuh akses akun.</text><text x="688" y="270" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Kuota mengikuti layanan.</text><path d="M188 322V353H500V382" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M500 322V382" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M812 322V353H500V382" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><rect x="42" y="387" width="916" height="127" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="423" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Sebelum memanggil alat</text><text x="65" y="454" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Periksa kebutuhan tugas, izin sumber, dan ketersediaan alat.</text><text x="65" y="481" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Untuk operasi berbayar, cek saldo dan perkiraan biaya dengan TokenShield.</text><rect x="42" y="540" width="916" height="53" rx="12" fill="#202A46" stroke="#3F5074"/><text x="61" y="574" font-size="18" fill="#F4F5FF" font-weight="600" text-anchor="start">Gemini Notebook · gunakan sesi browser yang sudah masuk, lalu cek sumbernya.</text></g>
</svg>
