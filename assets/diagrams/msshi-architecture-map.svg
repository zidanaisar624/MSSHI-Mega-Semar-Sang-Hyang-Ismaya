<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 645" width="1000" height="645" role="img" aria-labelledby="title desc">
<title id="title">Arsitektur lima bot MuZA</title><desc id="desc">Pengguna memberi ide ke Yukino. Shizuka menugaskan spesialis, menerima hasil mereka, dan membawa hasilnya kepada pengguna.</desc>
<defs>
  <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#10162A"/><stop offset="1" stop-color="#211C3B"/></linearGradient>
  <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#C7BAFF"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#A2E6D0"/></marker>
</defs>
<rect width="1000" height="645" rx="26" fill="url(#bg)"/>
<g font-family="Segoe UI,system-ui,sans-serif"><text x="42" y="45" font-size="17" fill="#FFDA94" font-weight="720" text-anchor="start">02   /   PRESET MuZA</text><text x="42" y="91" font-size="39" fill="#F4F5FF" font-weight="780" text-anchor="start">Siapa yang mengerjakan apa?</text><text x="43" y="123" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Baca peta dari ide awal, ke spesialis, lalu kembali ke pengguna.</text><path d="M309 220H360" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M636 220H688" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M821 283V312H182V351" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M821 283V312H499V351" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><path d="M821 283V351" fill="none" stroke="#C7BAFF" stroke-width="3"  marker-end="url(#forward)"/><rect x="42" y="157" width="267" height="126" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="186" font-size="16" fill="#FFDA94" font-weight="750" text-anchor="start">MULAI</text><text x="64" y="220" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Pengguna</text><text x="64" y="248" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Tujuan dan batas tugas.</text><rect x="364" y="157" width="272" height="126" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="386" y="186" font-size="16" fill="#C7BAFF" font-weight="750" text-anchor="start">IDE AWAL</text><text x="386" y="220" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Yukino</text><text x="386" y="248" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Ringkas ide menjadi brief.</text><rect x="692" y="157" width="266" height="126" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="714" y="186" font-size="16" fill="#FFDA94" font-weight="750" text-anchor="start">BAGI PEKERJAAN</text><text x="714" y="220" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Shizuka</text><text x="714" y="248" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Tetapkan tugas dan hasil.</text><rect x="42" y="354" width="282" height="126" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="64" y="383" font-size="16" fill="#A2E6D0" font-weight="750" text-anchor="start">BUKTI</text><text x="64" y="417" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Val</text><text x="64" y="445" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Literatur, data, dan batas.</text><rect x="359" y="354" width="282" height="126" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="381" y="383" font-size="16" fill="#F6C0E0" font-weight="750" text-anchor="start">DRAF KREATIF</text><text x="381" y="417" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Kiki-Chii</text><text x="381" y="445" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Film, foto, dan motion.</text><rect x="676" y="354" width="282" height="126" rx="18" fill="#1A2540" stroke="#3F5074"/><text x="698" y="383" font-size="16" fill="#AFCFFF" font-weight="750" text-anchor="start">IMPLEMENTASI</text><text x="698" y="417" font-size="26" fill="#F4F5FF" font-weight="750" text-anchor="start">Shikaku</text><text x="698" y="445" font-size="19" fill="#C4CFE8" font-weight="500" text-anchor="start">Kode, keamanan, dan uji.</text><path d="M183 481V514H500V540" fill="none" stroke="#A2E6D0" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#return)"/><path d="M500 481V540" fill="none" stroke="#A2E6D0" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#return)"/><path d="M819 481V514H500V540" fill="none" stroke="#A2E6D0" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#return)"/><rect x="42" y="543" width="916" height="53" rx="12" fill="#202A46" stroke="#3F5074"/><text x="61" y="577" font-size="18" fill="#F4F5FF" font-weight="600" text-anchor="start">Shizuka merangkum bukti dan hasil untuk pengguna, lalu mencatat keputusan.</text><text x="43" y="625" font-size="18" fill="#C4CFE8" font-weight="600" text-anchor="start">Ungu solid · tugas diteruskan     /     Hijau putus-putus · hasil kembali</text></g>
</svg>
